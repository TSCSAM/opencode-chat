<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f81f7'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='12' font-weight='bold' text-anchor='middle' fill='%2304121f'%3EOC%3C/text%3E%3C/svg%3E"
    />
    <title>OpenCode Chat</title>
    <script>
      (function () {
        var lang = "en"
        try {
          var saved = localStorage.getItem("oc-lang")
          if (saved === "fa" || saved === "en") lang = saved
        } catch (e) {}
        document.documentElement.lang = lang
        document.documentElement.dir = lang === "fa" ? "rtl" : "ltr"
        document.documentElement.setAttribute("data-lang", lang)
      })()
    </script>
    <script>
      if (location.protocol === "file:") {
        document.addEventListener("DOMContentLoaded", function () {
          var fa = document.documentElement.lang === "fa"
          document.body.setAttribute("dir", fa ? "rtl" : "ltr")
          document.body.style.cssText =
            "margin:0;height:100vh;display:grid;place-items:center;background:#0b0e13;color:#e7eef7;" +
            "font-family:'Segoe UI',Tahoma,sans-serif;text-align:center;line-height:2"
          document.body.innerHTML = fa
            ? '<div style="max-width:560px;padding:32px">' +
              '<div style="font-size:40px;margin-bottom:12px">⚡</div>' +
              '<h1 style="font-size:19px;margin:0 0 10px">این صفحه باید از طریق سرور باز شود</h1>' +
              '<p style="color:#8b9bb0;font-size:14px;margin:0 0 18px">' +
              'فایل index.html به‌تنهایی کار نمی‌کند، چون برنامه برای صحبت با موتور OpenCode ' +
              'به پروکسی محلی نیاز دارد.' +
              '</p>' +
              '<p style="font-size:14px;margin:0 0 8px">در ترمینال این را اجرا کن:</p>' +
              '<pre style="direction:ltr;text-align:left;background:#151c26;border:1px solid #1e2836;' +
              'border-radius:10px;padding:12px 14px;font-size:13px;overflow:auto">cd "path\\to\\opencode-chat"\nnpm run dev</pre>' +
              '<p style="font-size:14px;margin:18px 0 0">سپس این آدرس را باز کن:</p>' +
              '<p style="font-size:15px;color:#4c9aff;margin:6px 0 0">http://127.0.0.1:5178</p>' +
              '</div>'
            : '<div style="max-width:560px;padding:32px">' +
              '<div style="font-size:40px;margin-bottom:12px">⚡</div>' +
              '<h1 style="font-size:19px;margin:0 0 10px">This page must be opened through the server</h1>' +
              '<p style="color:#8b9bb0;font-size:14px;margin:0 0 18px">' +
              'index.html does not work on its own because the app needs a local proxy to talk ' +
              'to the OpenCode engine.' +
              '</p>' +
              '<p style="font-size:14px;margin:0 0 8px">Run this in a terminal:</p>' +
              '<pre style="direction:ltr;text-align:left;background:#151c26;border:1px solid #1e2836;' +
              'border-radius:10px;padding:12px 14px;font-size:13px;overflow:auto">cd "path\\to\\opencode-chat"\nnpm run dev</pre>' +
              '<p style="font-size:14px;margin:18px 0 0">Then open:</p>' +
              '<p style="font-size:15px;color:#4c9aff;margin:6px 0 0">http://127.0.0.1:5178</p>' +
              '</div>'
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
